[package]
name = "pubky-fiat-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Payment verifier gateway for Locks: speaks the Paykit Server wire contract, proxies BTC to the real Paykit Server, settles fiat criteria through processor plugins (Stripe test mode, PayPal sandbox)."
repository = "https://github.com/pubky/pubky-fiat-verifier"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
pubky = "=0.8.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "time", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
